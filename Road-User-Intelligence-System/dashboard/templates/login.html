<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CivicShield | Log In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = { theme: { extend: {
  colors: { "asphalt":"#21252B","cloud":"#F7F8FA","marking-yellow":"#F4B400","clear-green":"#2E8B57","outline":"#75777b" },
  fontFamily: { "headline-md":["Space Grotesk","sans-serif"], "body-md":["IBM Plex Sans","sans-serif"], "body-sm":["IBM Plex Sans","sans-serif"], "label-caps":["IBM Plex Sans","sans-serif"] }
}}}
</script>
<style>
  body { background-color: #F7F8FA; font-family:'IBM Plex Sans',sans-serif; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400; }
  .login-card-shadow { box-shadow: 0 1px 3px rgba(20,23,26,0.08); }
  .pulse-animation { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<main class="relative z-10 w-full max-w-[440px]">
  <div class="absolute -top-12 right-0 flex items-center gap-2 bg-white/80 backdrop-blur px-3 py-1.5 rounded-full login-card-shadow">
    <span class="w-2 h-2 rounded-full bg-clear-green pulse-animation"></span>
    <span class="text-[12px] font-semibold uppercase tracking-wider text-outline">System Ready</span>
  </div>
  <div class="bg-white rounded-lg login-card-shadow p-8 md:p-12">
    <div class="flex flex-col items-center mb-10">
      <div class="w-10 h-10 bg-asphalt rounded-lg flex items-center justify-center mb-4">
        <span class="material-symbols-outlined text-white text-[24px]" style="font-variation-settings:'FILL' 1;">shield</span>
      </div>
      <h1 class="font-headline-md text-2xl text-asphalt tracking-tight">CivicShield</h1>
      <p class="text-sm text-outline mt-1">School Zone Safety Intelligence System</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="mb-6 text-sm text-alert-red bg-red-50 border border-red-200 rounded-lg p-3">
        {% for m in messages %}{{ m }}{% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="space-y-6">
      <div class="space-y-2">
        <label class="block text-[12px] font-semibold uppercase tracking-wide text-on-surface-variant" for="username">Username</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
          <input class="w-full pl-10 pr-4 py-3 bg-cloud border border-gray-200 rounded-lg focus:ring-2 focus:ring-asphalt focus:border-asphalt transition-all text-asphalt" id="username" name="username" placeholder="Enter your username" type="text" required autofocus/>
        </div>
      </div>
      <div class="space-y-2">
        <label class="block text-[12px] font-semibold uppercase tracking-wide text-on-surface-variant" for="password">Password</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
          <input class="w-full pl-10 pr-4 py-3 bg-cloud border border-gray-200 rounded-lg focus:ring-2 focus:ring-asphalt focus:border-asphalt transition-all text-asphalt" id="password" name="password" placeholder="••••••••" type="password" required/>
        </div>
      </div>
      <button class="w-full bg-marking-yellow text-asphalt py-4 rounded-lg font-bold hover:brightness-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-8" type="submit">
        Log In
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </form>

    <div class="mt-10 pt-8 border-t border-gray-100 flex justify-between items-center">
      <p class="text-sm text-outline">Local Processing</p>
      <a href="{{ url_for('landing') }}" class="text-sm text-outline hover:text-asphalt underline">Back to Overview</a>
    </div>
  </div>
  <footer class="mt-8 text-center">
    <p class="text-sm text-outline">Final-Year Project — RUIS, Tamale, Ghana</p>
  </footer>
</main>
</body>
</html>
