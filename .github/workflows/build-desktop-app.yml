name: Build Desktop Application Executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-executable:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            os: windows-latest
            artifact_name: rszsis-desktop-windows-x64
            archive_ext: zip
          - name: macos-arm64
            os: macos-latest
            artifact_name: rszsis-desktop-macos-arm64
            archive_ext: zip
          - name: linux-x64
            os: ubuntu-latest
            artifact_name: rszsis-desktop-linux-x64
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux GUI & OpenGL system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libglib2.0-0

      - name: Generate clean .env file from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          import os
          url = os.environ.get('SUPABASE_URL', '')
          key = os.environ.get('SUPABASE_ANON_KEY', '')
          with open('rszsis-desktop-app/.env', 'w', encoding='utf-8') as f:
              f.write(f'SUPABASE_URL={url}\nSUPABASE_ANON_KEY={key}\n')
          "

      - name: Ensure SQLite database file exists for bundle
        run: |
          python -c "
          from pathlib import Path
          db_path = Path('Road-User-Intelligence-System/safety_events.db')
          db_path.parent.mkdir(parents=True, exist_ok=True)
          db_path.touch(exist_ok=True)
          "

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r rszsis-desktop-app/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm rszsis-desktop-app/rszsis-desktop.spec

      - name: Ensure empty runtime output directories exist
        run: |
          python -c "
          from pathlib import Path
          dist = Path('rszsis-desktop-app/dist/rszsis-desktop/Road-User-Intelligence-System/data')
          for folder in ['raw_videos', 'processed', 'violations', 'calibration_frames']:
              (dist / folder).mkdir(parents=True, exist_ok=True)
          "

      - name: Archive build output (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path rszsis-desktop-app/dist/rszsis-desktop/* -DestinationPath ${{ matrix.platform.artifact_name }}.zip

      - name: Archive build output (macOS)
        if: runner.os == 'macOS'
        run: |
          cd rszsis-desktop-app/dist/rszsis-desktop
          zip -r ../../../${{ matrix.platform.artifact_name }}.zip .

      - name: Archive build output (Linux)
        if: runner.os == 'Linux'
        run: |
          cd rszsis-desktop-app/dist/rszsis-desktop
          tar -czvf ../../../${{ matrix.platform.artifact_name }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_name }}.${{ matrix.platform.archive_ext }}
