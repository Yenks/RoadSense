name: Build Desktop Application Executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-executable:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            os: windows-latest
            artifact_name: RoadSense-Desktop-Windows
            archive_ext: zip
          - name: macos-arm64
            os: macos-latest
            artifact_name: RoadSense-Desktop-macOS
            archive_ext: zip
          - name: linux-x64
            os: ubuntu-latest
            artifact_name: RoadSense-Desktop-Linux
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux GUI & OpenGL system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libglib2.0-0

      - name: Generate clean .env file from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          import os
          url = os.environ.get('SUPABASE_URL', '')
          key = os.environ.get('SUPABASE_ANON_KEY', '')
          with open('rszsis-desktop-app/.env', 'w', encoding='utf-8') as f:
              f.write(f'SUPABASE_URL={url}\nSUPABASE_ANON_KEY={key}\n')
          "

      - name: Ensure SQLite database file exists for bundle
        run: |
          python -c "
          from pathlib import Path
          db_path = Path('Road-User-Intelligence-System/safety_events.db')
          db_path.parent.mkdir(parents=True, exist_ok=True)
          db_path.touch(exist_ok=True)
          "

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r rszsis-desktop-app/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyinstaller

      - name: Ensure model weights file exists for bundle
        run: |
          python -c "
          import shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          target = Path('Road-User-Intelligence-System/data/models/yolov8m_visdrone.pt')
          target.parent.mkdir(parents=True, exist_ok=True)
          if not target.exists():
              print('Downloading model weights from Hugging Face...')
              downloaded = hf_hub_download(repo_id='mshamrai/yolov8m-visdrone', filename='best.pt')
              shutil.copy(downloaded, target)
              print('Model weights saved to', target)
          "

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm rszsis-desktop-app/rszsis-desktop.spec

      - name: Ensure empty runtime output directories exist in build dist
        run: |
          python -c "
          import os, sys
          from pathlib import Path
          dist = Path('dist/rszsis-desktop/Road-User-Intelligence-System/data')
          for folder in ['raw_videos', 'processed', 'violations', 'calibration_frames']:
              p = dist / folder
              p.mkdir(parents=True, exist_ok=True)
              print(f'Ensured directory: {p}')
          "

      - name: Archive build output
        run: |
          python -c "
          import shutil, os, sys
          from pathlib import Path

          src = Path('dist/rszsis-desktop')
          if not src.exists():
              print(f'CRITICAL ERROR: Build dist directory {src} does not exist!')
              sys.exit(1)

          fmt = 'gztar' if '${{ matrix.platform.archive_ext }}' == 'tar.gz' else 'zip'
          out_base = '${{ matrix.platform.artifact_name }}'
          
          archive = shutil.make_archive(out_base, fmt, str(src))
          print(f'Created archive: {archive} ({os.path.getsize(archive)} bytes)')
          "

      - name: Verify archive size and file integrity
        run: |
          python -c "
          import os, sys
          from pathlib import Path

          archive_name = '${{ matrix.platform.artifact_name }}.${{ matrix.platform.archive_ext }}'
          archive_path = Path(archive_name)

          if not archive_path.exists():
              print(f'CRITICAL ERROR: Archive file {archive_name} does not exist!')
              sys.exit(1)

          size_bytes = os.path.getsize(archive_path)
          size_mb = size_bytes / (1024 * 1024)
          print(f'VERIFICATION: Archive {archive_name} size is {size_mb:.2f} MB ({size_bytes} bytes)')

          MIN_SIZE_MB = 100.0
          if size_mb < MIN_SIZE_MB:
              print(f'CRITICAL ERROR: Archive size {size_mb:.2f} MB is below required threshold ({MIN_SIZE_MB} MB)!')
              sys.exit(1)

          print(f'SUCCESS: Archive size verification passed ({size_mb:.2f} MB >= {MIN_SIZE_MB} MB).')
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_name }}.${{ matrix.platform.archive_ext }}

  publish-release:
    name: Publish GitHub Release
    needs: build-executable
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Display downloaded files
        run: ls -R

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: RoadSense Desktop App v1.0.0
          body: Initial multi-platform standalone desktop application release for RoadSense — detects and logs road-safety violations from video footage.
          files: |
            RoadSense-Desktop-Windows/RoadSense-Desktop-Windows.zip
            RoadSense-Desktop-macOS/RoadSense-Desktop-macOS.zip
            RoadSense-Desktop-Linux/RoadSense-Desktop-Linux.tar.gz
